<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson 9: Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#ffffff;
  --sun:#ffe94d;
  --pink:#ff4fa3;
  --cyan:#3df0ff;
  --lime:#5dff9a;
  --red:#ff6b6b;
  --head:"Bowlby One","Arial Black","Impact",sans-serif;
  --body:"Outfit","Trebuchet MS","Segoe UI",Arial,sans-serif;
  --halo:0 2px 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.85),0 0 34px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:#000;color:var(--ink);
  font-family:var(--body);font-weight:700;font-size:clamp(18px,2.1vw,25px);line-height:1.5;
  overflow:hidden;
  text-shadow:var(--halo);
  -webkit-text-stroke:2.5px rgba(0,0,0,.55);paint-order:stroke fill;
}
button{font:inherit;color:inherit;text-shadow:inherit;-webkit-text-stroke:inherit;paint-order:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:6px}

/* ---------- photo backdrop ---------- */
.bgwrap{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;filter:brightness(.66) saturate(1.15)}
.bg.on{opacity:1;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.13) translate(-1.2%,.8%)}}
.notes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.note{position:absolute;bottom:-60px;font-size:var(--s);color:var(--c);opacity:0;text-shadow:0 0 14px var(--c),0 2px 4px rgba(0,0,0,.8);-webkit-text-stroke:0;animation:rise var(--t) linear forwards}
@keyframes rise{
  0%{transform:translate(0,0) rotate(-12deg);opacity:0}
  12%{opacity:.85}
  50%{transform:translate(calc(var(--dx)*-.5),-55vh) rotate(14deg)}
  100%{transform:translate(var(--dx),-115vh) rotate(-18deg);opacity:0}
}

/* ---------- layout ---------- */
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
header{padding:16px 5vw 6px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.brand{display:flex;align-items:flex-end;gap:16px}
h1{margin:0;font-family:var(--head);font-weight:400;font-size:clamp(28px,5.4vw,58px);line-height:1;letter-spacing:.01em;display:flex;flex-wrap:wrap}
h1 span{display:inline-block;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*55ms)}
h1 span.sp{width:.3em}
h1 span:nth-child(4n+1){color:var(--sun)}
h1 span:nth-child(4n+2){color:var(--pink)}
h1 span:nth-child(4n+3){color:var(--cyan)}
h1 span:nth-child(4n){color:var(--lime)}
@keyframes drop{from{transform:translateY(-70px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.eq{display:flex;align-items:flex-end;gap:5px;height:40px;padding-bottom:4px}
.eq i{display:block;width:7px;height:100%;border-radius:3px;background:var(--c);transform-origin:bottom;animation:eq var(--d) ease-in-out infinite alternate;box-shadow:0 0 10px var(--c)}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
nav{display:flex;flex-wrap:wrap;gap:4px 26px;margin-left:auto}
nav button{font-family:var(--head);font-size:clamp(16px,2vw,24px);padding:6px 2px;position:relative;opacity:.8;transition:opacity .2s,transform .2s}
nav button:hover{opacity:1;transform:translateY(-2px)}
nav button[aria-selected="true"]{opacity:1;color:var(--sun)}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:5px;border-radius:3px;background:var(--pink);box-shadow:0 0 14px var(--pink);transform-origin:left;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}

.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 5vw 26px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 26px),transparent 100%);
  scrollbar-width: thin;scrollbar-color:rgba(255,255,255,.6) transparent}
.view{animation:fade .45s ease both;max-width:1100px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-family:var(--head);font-weight:400;font-size:clamp(28px,4.2vw,50px);line-height:1.05;margin:0 0 10px;color:var(--sun)}
h3{font-family:var(--head);font-weight:400;font-size:clamp(20px,2.4vw,28px);margin:26px 0 8px;color:var(--cyan)}
p{margin:0 0 1.1em;max-width:36em}
.hint{color:var(--cyan);font-weight:800;margin-bottom:18px;max-width:none}

.btn{display:inline-block;border:3px solid #fff;border-radius:999px;padding:6px 22px;font-weight:800;transition:transform .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-3px) rotate(-1.2deg);color:var(--sun);border-color:var(--sun)}
.btn.pink{border-color:var(--pink);color:var(--pink)}
.btn.pink:hover{color:var(--sun);border-color:var(--sun)}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-top:12px}

/* words */
.w{color:var(--sun);font-weight:800;text-decoration:underline wavy var(--pink) 2px;text-underline-offset:6px;cursor:pointer;transition:color .15s}
.w:hover,.w:focus-visible{color:var(--cyan);animation:bob .5s ease}
@keyframes bob{40%{transform:translateY(-5px) rotate(-2deg)}}
.more a{color:var(--lime);margin-right:18px;display:inline-block}

/* glossary */
.search{display:block;width:min(520px,100%);background:transparent;border:0;border-bottom:4px solid #fff;color:#fff;font:inherit;font-weight:800;padding:6px 2px;margin:10px 0 22px;text-shadow:var(--halo);-webkit-text-stroke:inherit}
.search::placeholder{color:rgba(255,255,255,.75)}
.search:focus{outline:0;border-bottom-color:var(--sun)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px 26px}
.gl button{text-align:left;display:block;transition:transform .2s}
.gl button:hover{transform:translateX(8px)}
.gl .t{display:block;color:var(--sun);font-weight:800;font-size:1.25em;line-height:1.2}
.gl .p{display:block;color:var(--cyan);font-size:.88em;font-weight:700}
.gl .k{display:block;font-size:.72em;font-weight:700;opacity:.92;font-style:italic}

/* word detail */
.detail{position:fixed;inset:0;z-index:20;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 6vw calc(40px + env(safe-area-inset-bottom,0px));
  -webkit-backdrop-filter:blur(16px) brightness(.42) saturate(1.2);backdrop-filter:blur(16px) brightness(.42) saturate(1.2);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.detail.open{opacity:1;visibility:visible}
.detail .in{max-width:820px;margin:0 auto;animation:pop .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.92) translateY(18px);opacity:0}to{transform:none;opacity:1}}
.detail .close{display:block;margin-left:auto;font-weight:800;font-size:1.1em;padding:4px 2px}
.detail .close:hover{color:var(--pink)}
.detail h2{font-size:clamp(32px,6vw,68px);margin-top:4px}
.pos{font-style:italic;font-weight:700}
.ipa{color:var(--cyan);font-size:1.45em;font-weight:800;margin:6px 0 0;max-width:none}
.say{color:var(--pink);font-weight:800;margin:0 0 6px;max-width:none}
.def{font-size:1.25em;line-height:1.4;font-weight:800}
.ex{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
.ex .play{flex:none;color:var(--lime);font-size:1.3em;line-height:1.2;transition:transform .2s}
.ex .play:hover{transform:scale(1.25);color:var(--sun)}
.ex b{color:var(--sun);font-weight:800}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px}

/* quiz */
.bank{color:var(--cyan);font-weight:800;margin-bottom:6px;max-width:none}
.bank span{margin-right:12px;white-space:nowrap}
.prog{font-family:var(--head);color:var(--pink);font-size:1.1em;margin:18px 0 4px}
.qs{font-size:clamp(22px,3.2vw,38px);font-weight:800;line-height:1.3;max-width:26em;margin-bottom:22px}
.qs .blank{color:var(--sun);letter-spacing:.06em}
.qs .fill{color:var(--lime)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,max-content));gap:14px 18px}
.opt{border:3px solid #fff;border-radius:16px;padding:8px 26px;font-weight:800;font-size:1.15em;transition:transform .2s,border-color .2s,color .2s}
.opt:hover:not(:disabled){transform:translateY(-4px) rotate(-1.5deg);border-color:var(--sun);color:var(--sun)}
.opt.ok{border-color:var(--lime);color:var(--lime);animation:pulse .6s ease}
.opt.no{border-color:var(--red);color:var(--red);animation:shake .45s ease}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.55}
@keyframes pulse{40%{transform:scale(1.14)}}
@keyframes shake{20%{transform:translateX(-9px)}45%{transform:translateX(9px)}70%{transform:translateX(-5px)}}
.fb{min-height:1.6em;margin:18px 0 0;font-weight:800;max-width:none}
.score{font-family:var(--head);font-size:clamp(46px,9vw,110px);line-height:1;color:var(--sun);margin:8px 0}
.miss a{color:var(--pink);display:inline-block;margin-right:18px}

/* speaking game */
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px 50px;align-items:start}
@media(max-width:860px){.game{grid-template-columns:1fr}}
.qno{font-family:var(--head);color:var(--pink);font-size:1.2em}
.big{font-size:clamp(26px,4.2vw,54px);font-weight:800;line-height:1.15;margin:4px 0 14px;max-width:16em;min-height:2.3em}
.big.new{animation:flip .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:rotateX(85deg) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.tip{color:var(--cyan);max-width:28em}
.timer{font-family:var(--head);font-size:clamp(40px,7vw,84px);line-height:1;color:var(--lime);min-width:2.2ch}
.timer.low{color:var(--red);animation:pulse .5s ease infinite}
.nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.nums button{aspect-ratio:1;max-width:66px;border:3px solid #fff;border-radius:50%;font-weight:800;transition:transform .2s,border-color .2s,color .2s}
.nums button:hover{transform:scale(1.14) rotate(-6deg);border-color:var(--sun);color:var(--sun)}
.nums button.used{border-color:var(--pink);color:var(--pink);opacity:.7}
.nums button.now{border-color:var(--sun);color:var(--sun);background:none;animation:pulse 1s ease infinite}

/* footer: backgrounds */
footer{padding:8px 5vw 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.arrow{font-family:var(--head);font-size:1.5em;padding:0 8px;transition:transform .2s,color .2s}
.arrow:hover{transform:scale(1.25);color:var(--sun)}
.thumbs{display:flex;gap:9px;overflow-x:auto;padding:6px 4px;max-width:100%;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:none;width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.75);transition:transform .2s,border-color .2s;-webkit-text-stroke:0}
.thumbs button:hover{transform:scale(1.2)}
.thumbs button[aria-current="true"]{border-color:var(--sun);transform:scale(1.25);box-shadow:0 0 14px var(--sun)}
.cap{margin-left:auto;font-weight:800;font-size:.8em;max-width:none}

@media(max-width:640px){
  header{padding-top:10px}nav{margin-left:0}
  .cap{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .notes{display:none}
}
</style>
</head>

<div class="bgwrap" aria-hidden="true"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div></div>

<div class="app">
  <header>
    <div class="brand">

      <div class="eq" aria-hidden="true">

      </div>
    </div>
    <nav role="tablist" aria-label="Lesson sections">
      <button role="tab" data-tab="text" aria-selected="true">Text</button>

      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
      <button role="tab" data-tab="speak" aria-selected="false">Speaking game</button>
    </nav>
  </header>

  <main class="stage" id="stage"><div class="view" id="view"></div></main>

  <footer>
    <button class="arrow" id="prevBg" aria-label="Previous background">&#8249;</button>
    <div class="thumbs" id="thumbs" role="group" aria-label="Choose a background"></div>
    <button class="arrow" id="nextBg" aria-label="Next background">&#8250;</button>
    <button class="arrow" id="auto" aria-label="Pause background changes" title="Pause / play backgrounds">&#10074;&#10074;</button>
    <p class="cap" id="cap"></p>
  </footer>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Word details"></div>

 ex:["The strange little film developed a *cult following*.","The band never had a hit, but it has a *cult following*.","That TV series still has a *cult following* today."]}
];
const byKey = Object.fromEntries(W.map(w=>[w.k,w]));

const PASSAGE = [
 "My older brother Alex is [[gifted|musically gifted]]. He can hear a tune once and play it from memory, and he never needs [[sheet|sheet music]]. In his free time he is always [[strum|strumming]] his guitar, [[compose|composing music]] or writing [[lyrics|song lyrics]].",
 "Alex and his friends started a band, and it soon built a [[sizable|sizable following]] in our city. At first they [[gig|played gigs]] in bars and clubs. With the money they earned, they recorded their [[debut|debut album]].",
 "One [[remix|remixed track]] from that album became a [[hit|massive hit]] on local radio because of its [[catchy|catchy tune]] and [[upbeat|upbeat tempo]].",
 "Their second album will be [[release|released]] at the end of the year, and they plan to [[reclive|record it live]] at their next show. Alex dreams of [[tour|going on tour]]. He is waiting for his [[break|big break]], the chance to [[foot|get his foot in the door]] of the [[industry|music industry]].",
 "As for me, I love to [[along|sing along]] to my brother's songs, but I will never be a musician. I'm completely [[tonedeaf|tone-deaf]] and I always sing [[offkey|off-key]]!"
];
const MORE = ["contemporary","classical","orchestral","solo","compilation","cult"];

const BANK = ["gifted","lyrics","remixed","debut","strumming","tune","gig","following","tour","off-key","hit","upbeat"];
const QUIZ = [
 {s:"That song was a huge ___ last summer; you could hear it everywhere.",a:"hit",k:"hit"},
 {s:"I love the melody, but I can't understand the ___.",a:"lyrics",k:"lyrics"},
 {s:"My sister is really musically ___; she learned the piano in a week.",a:"gifted",k:"gifted"},
 {s:"What a catchy ___! I can't stop humming it.",a:"tune",k:"catchy"},
 {s:"The band is going on ___ next month and will visit ten countries.",a:"tour",k:"tour"},
 {s:"He sang completely ___ and the whole room laughed.",a:"off-key",k:"offkey"},
 {s:"Her ___ album came out when she was only sixteen.",a:"debut",k:"debut"},
 {s:"The DJ played a ___ version of the old song with a dance beat.",a:"remixed",k:"remix"},
 {s:"The fast, ___ rhythm made everybody want to dance.",a:"upbeat",k:"upbeat"},
 {s:"The guitarist sat on the stage, ___ softly while the crowd sang.",a:"strumming",k:"strum"},
 {s:"The young rapper has a large ___ on social media.",a:"following",k:"sizable"},
 {s:"Our band has a ___ at the youth club on Saturday night.",a:"gig",k:"gig"}
];

const MOVIE_Q = [
 "What is your favourite movie?","Do you like watching movies at home or at the cinema?","Who is your favourite actor?","Who is your favourite actress?","What kind of movies do you like: comedy, horror, action or romance?",
 "When did you last go to the cinema?","Who do you usually watch movies with?","Do you like cartoons? Why or why not?","What is the best movie you have ever seen?","Do you like scary movies?",
 "Do you eat popcorn when you watch a movie?","What movie did you watch last week?","Do you prefer old movies or new movies?","What is your favourite movie from your country?","Can you tell me about a funny movie?",
 "Have you seen a movie more than once? Which one?","Do you like movies with subtitles?","Who is your favourite cartoon character?","How often do you watch movies?","Do you like action movies? Why?",
 "Which movie made you cry?","Which movie made you laugh a lot?","Do you read the book before you watch the movie?","What is a good movie for children?","Would you like to be a movie star? Why?",
 "What is your favourite song from a movie?","Do you like watching movies online or on TV?","Is there a movie you don't like? Why?","Which movie would you recommend to a friend?","If you could meet a movie character, who would it be?"
];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const view = $("#view"), stage = $("#stage"), det = $("#detail");
const fmt = s => s.replace(/\*(.+?)\*/g,"<b>$1</b>");
const plain = s => s.replace(/\*/g,"");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };

function speak(text, rate){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = rate || .9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function beep(){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.type="sine"; o.frequency.value=880; g.gain.value=.15;
    o.start(); o.stop(c.currentTime+.35);
  }catch(e){}
}

/* ================= TITLE ================= */
(function(){
  const t = $("#title"); let i = 0;
  "Lesson 9: Music".split("").forEach(ch=>{
    const s = document.createElement("span");
    s.style.setProperty("--i", i++);
    if(ch===" "){ s.className="sp"; s.innerHTML="&nbsp;" } else s.textContent = ch;
    s.setAttribute("aria-hidden","true");
    t.appendChild(s);
  });
})();

/* ================= BACKGROUNDS ================= */
let bi = 0, front = $("#bgA"), back = $("#bgB"), autoOn = true, autoTimer = null;
function setBg(n, instant){
  bi = (n + IMGS.length) % IMGS.length;
  back.style.backgroundImage = "url("+IMGS[bi].src+")";
  back.classList.add("on"); front.classList.remove("on");
  [front, back] = [back, front];
  document.querySelectorAll("#thumbs button").forEach((b,i)=>b.setAttribute("aria-current", i===bi ? "true":"false"));
  $("#cap").textContent = IMGS[bi].name;
}
function restartAuto(){
  clearInterval(autoTimer);
  if(autoOn) autoTimer = setInterval(()=>setBg(bi+1), 9000);
}
(function(){
  const th = $("#thumbs");
  IMGS.forEach((im,i)=>{
    const b = document.createElement("button");
    b.style.backgroundImage = "url("+im.src+")";
    b.setAttribute("aria-label","Background "+(i+1)+": "+im.name);
    b.onclick = ()=>{ setBg(i); restartAuto(); };
    th.appendChild(b);
  });
  $("#prevBg").onclick = ()=>{ setBg(bi-1); restartAuto(); };
  $("#nextBg").onclick = ()=>{ setBg(bi+1); restartAuto(); };
  $("#auto").onclick = function(){
    autoOn = !autoOn; this.innerHTML = autoOn ? "&#10074;&#10074;" : "&#9654;";
    this.setAttribute("aria-label", autoOn ? "Pause background changes" : "Play background changes");
    restartAuto();
  };
  setBg(0); restartAuto();
})();

/* ================= FLOATING NOTES ================= */
(function(){
  if(reduce) return;
  const box = $("#notes"), glyphs = ["♪","♫","♬","♩"], cols = ["#ffe94d","#ff4fa3","#3df0ff","#5dff9a","#ffffff"];
  function spawn(){
    if(document.hidden || box.children.length > 16) return;
    const n = document.createElement("div"); n.className = "note";
    n.textContent = glyphs[Math.random()*glyphs.length|0];
    n.style.left = (Math.random()*96)+"vw";
    n.style.setProperty("--s", (26+Math.random()*44)+"px");
    n.style.setProperty("--c", cols[Math.random()*cols.length|0]);
    n.style.setProperty("--t", (10+Math.random()*8)+"s");
    n.style.setProperty("--dx", (Math.random()*160-80)+"px");
    n.addEventListener("animationend", ()=>n.remove());
    box.appendChild(n);
  }
  setInterval(spawn, 1100); spawn(); spawn();
})();

/* ================= TABS ================= */
let tab = "text", timer = null;
function show(name){
  tab = name; clearInterval(timer); if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name));
  view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
  ({text:renderText, glossary:renderGlossary, quiz:renderQuiz, speak:renderSpeak})[name]();
  stage.scrollTop = 0;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick = ()=>show(b.dataset.tab));

/* ---- TEXT ---- */
function renderText(){
  const html = PASSAGE.map(p=>"<p>"+p.replace(/\[\[(\w+)\|(.+?)\]\]/g,'<span class="w" role="button" tabindex="0" data-w="$1">$2</span>')+"</p>").join("");
  const more = MORE.map(k=>'<a class="w" style="text-decoration:none;color:var(--lime)" role="button" tabindex="0" data-w="'+k+'">'+byKey[k].t+'</a>').join("");
  view.innerHTML = `
    <h2>Alex the musician</h2>
    <p class="hint">Tap any glowing word to see its meaning, pronunciation and 3 examples.</p>
    <div id="passage">${html}</div>
    <div class="row"><button class="btn pink" id="readAll">&#128266; Read the text aloud</button></div>
    <h3>More music words</h3>
    <p class="more" style="max-width:none">${more}</p>`;
  $("#readAll").onclick = ()=>speak($("#passage").textContent, .88);
}

/* ---- GLOSSARY ---- */
function renderGlossary(){
  view.innerHTML = `
    <h2>Glossary</h2>
    <p class="hint">${W.length} words and phrases. Tap one to open it.</p>
    <input class="search" id="q" type="search" placeholder="Search a word…" aria-label="Search the glossary" autocomplete="off">
    <div class="gl" id="gl"></div>`;
  const draw = f => {
    const list = W.filter(w=>!f || w.t.toLowerCase().includes(f) || w.d.toLowerCase().includes(f));
    $("#gl").innerHTML = list.length ? list.map(w=>`<button data-w="${w.k}"><span class="t">${w.t}</span><span class="p">${w.ipa.split("  ")[0]}</span><span class="k">${w.pos}</span></button>`).join("") : "<p>No word found. Try another spelling.</p>";
  };
  draw("");
  $("#q").oninput = e=>draw(e.target.value.trim().toLowerCase());
}

/* ---- WORD DETAIL ---- */
let curK = null, lastFocus = null;
function openWord(k){
  const w = byKey[k]; if(!w) return;
  curK = k; const i = W.indexOf(w), pv = W[(i+W.length-1)%W.length], nx = W[(i+1)%W.length];
  lastFocus = document.activeElement;
  det.innerHTML = `<div class="in">
    <button class="close" id="dc">&#10005; Close</button>
    <h2>${w.t}</h2>
    <p class="pos">${w.pos}</p>
    <p class="ipa">${w.ipa}</p>
    <p class="say">Sounds like: ${w.say}</p>
    <div class="row" style="margin-top:4px"><button class="btn" data-sw="1">&#128266; Listen</button><button class="btn" data-sw=".55">&#128034; Slowly</button></div>
    <h3>Meaning</h3>
    <p class="def">${w.d}</p>
    <h3>3 examples</h3>
    ${w.ex.map((e,n)=>`<div class="ex"><button class="play" data-ex="${n}" aria-label="Listen to example ${n+1}">&#9654;</button><p style="margin:0">${fmt(e)}</p></div>`).join("")}
    <div class="pn"><button class="btn" data-w="${pv.k}">&#8249; ${pv.t}</button><button class="btn" data-w="${nx.k}">${nx.t} &#8250;</button></div>
  </div>`;
  det.classList.add("open"); det.scrollTop = 0;
  setTimeout(()=>{ const c=$("#dc"); c && c.focus() }, 50);
}
function closeWord(){
  det.classList.remove("open"); curK = null;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
det.addEventListener("click", e=>{
  if(e.target.closest("#dc") || e.target===det){ closeWord(); return; }
  const sw = e.target.closest("[data-sw]"); if(sw){ speak(byKey[curK].t.replace(/\(.*?\)/g,""), +sw.dataset.sw); return; }
  const ex = e.target.closest("[data-ex]"); if(ex){ speak(plain(byKey[curK].ex[+ex.dataset.ex]), .88); return; }
  const w = e.target.closest("[data-w]"); if(w){ openWord(w.dataset.w); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && det.classList.contains("open")) closeWord();
  if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".w[data-w]")){ e.preventDefault(); openWord(e.target.dataset.w); }
});
view.addEventListener("click", e=>{
  const w = e.target.closest("[data-w]"); if(w) openWord(w.dataset.w);
});

/* ---- QUIZ ---- */
let qz = {i:0, score:0, done:false, miss:[]};
function renderQuiz(){
  const bank = `<p class="bank">${BANK.map(b=>"<span>"+b+"</span>").join("")}</p>`;
  if(qz.i >= QUIZ.length){
    const msg = qz.score>=11 ? "Superstar! You're ready for the stage." : qz.score>=8 ? "Great gig! Just a few notes to polish." : qz.score>=5 ? "Good start. Practise the tricky words and try again." : "Keep rehearsing. Read the text and try again.";
    view.innerHTML = `<h2>Quiz finished</h2><div class="score">${qz.score} / ${QUIZ.length}</div><p>${msg}</p>
      ${qz.miss.length ? `<h3>Words to review</h3><p class="miss" style="max-width:none">${qz.miss.map(k=>`<a class="w" style="text-decoration:none;color:var(--pink)" role="button" tabindex="0" data-w="${k}">${byKey[k].t}</a>`).join("")}</p>`:""}
      <div class="row"><button class="btn pink" id="again">&#8635; Play again</button></div>`;
    $("#again").onclick = ()=>{ qz = {i:0,score:0,done:false,miss:[]}; renderQuiz(); };
    return;
  }
  const q = QUIZ[qz.i];
  const opts = shuffle([q.a, ...shuffle(BANK.filter(b=>b!==q.a)).slice(0,3)]);
  view.innerHTML = `<h2>Quiz</h2>${bank}
    <div class="prog">Question ${qz.i+1} of ${QUIZ.length}</div>
    <div class="qs" id="qs">${q.s.replace("___",'<span class="blank">_______</span>')}</div>
    <div class="opts" id="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
    <p class="fb" id="fb"></p><div class="row" id="nx"></div>`;
  $("#opts").onclick = e=>{
    const b = e.target.closest(".opt"); if(!b || b.disabled) return;
    const ok = b.dataset.o === q.a;
    document.querySelectorAll(".opt").forEach(x=>{ x.disabled = true; if(x.dataset.o===q.a) x.classList.add("ok") });
    if(ok){ qz.score++; $("#fb").style.color="var(--lime)"; $("#fb").textContent="Correct! Nice one."; }
    else { b.classList.add("no"); qz.miss.push(q.k); $("#fb").style.color="var(--red)"; $("#fb").textContent="Not quite. The answer is \""+q.a+"\"."; }
    $("#qs").innerHTML = q.s.replace("___",'<span class="fill">'+q.a+'</span>');
    $("#nx").innerHTML = `<button class="btn pink" id="go">${qz.i===QUIZ.length-1?"See my score":"Next question"} &#8250;</button><button class="btn" data-w="${q.k}">What does it mean?</button>`;
    $("#go").onclick = ()=>{ qz.i++; renderQuiz(); };
    $("#go").focus();
  };
}

/* ---- SPEAKING GAME ---- */
let sp = {cur:null, used:new Set()};
function renderSpeak(){
  view.innerHTML = `
    <h2>Speaking game: Movies</h2>
    <p class="hint">Pick a number or draw a random question. Answer in 3 sentences: your answer, a reason, an example.</p>
    <div class="game">
      <div>
        <div class="qno" id="qno"></div>
        <div class="big" id="big">Press “Random question” to start.</div>
        <p class="tip" id="tip">Bonus: use one new word from the lesson.</p>
        <div class="row">
          <button class="btn pink" id="rnd">&#127922; Random question</button>
          <button class="btn" id="hear">&#128266; Read it</button>
          <button class="btn" id="tm">&#9201; 30 seconds</button>
          <span class="timer" id="clock" aria-live="off"></span>
        </div>
        <div class="row"><span id="cnt"></span><button class="btn" id="reset">Reset</button></div>
      </div>
      <div class="nums" id="nums" role="group" aria-label="Choose a question number">
        ${MOVIE_Q.map((_,i)=>`<button data-n="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}
      </div>
    </div>`;
  const paint = () => {
    document.querySelectorAll("#nums button").forEach(b=>{
      const n = +b.dataset.n; b.classList.toggle("used", sp.used.has(n) && n!==sp.cur); b.classList.toggle("now", n===sp.cur);
    });
    $("#cnt").textContent = "Asked: "+sp.used.size+" / "+MOVIE_Q.length;
  };
  const pick = n => {
    sp.cur = n; sp.used.add(n);
    clearInterval(timer); $("#clock").textContent = ""; $("#clock").classList.remove("low");
    $("#qno").textContent = "Question "+(n+1);
    const big = $("#big"); big.textContent = MOVIE_Q[n]; big.classList.remove("new"); void big.offsetWidth; big.classList.add("new");
    paint();
  };
  $("#nums").onclick = e=>{ const b = e.target.closest("button"); if(b) pick(+b.dataset.n) };
  $("#rnd").onclick = ()=>{
    let pool = MOVIE_Q.map((_,i)=>i).filter(i=>!sp.used.has(i));
    if(!pool.length){ sp.used = new Set(); pool = MOVIE_Q.map((_,i)=>i).filter(i=>i!==sp.cur); }
    pick(pool[Math.random()*pool.length|0]);
  };
  $("#hear").onclick = ()=>{ if(sp.cur!==null) speak(MOVIE_Q[sp.cur], .9) };
  $("#tm").onclick = ()=>{
    clearInterval(timer); let s = 30; const c = $("#clock"); c.classList.remove("low"); c.textContent = s;
    timer = setInterval(()=>{
      s--; c.textContent = s>0 ? s : "Time!";
      if(s<=5) c.classList.add("low");
      if(s<=0){ clearInterval(timer); beep(); }
    }, 1000);
  };
  $("#reset").onclick = ()=>{ sp = {cur:null, used:new Set()}; renderSpeak(); };
  if(sp.cur!==null){ $("#qno").textContent = "Question "+(sp.cur+1); $("#big").textContent = MOVIE_Q[sp.cur]; }
  paint();
}

show("text");
</script>
